[pytest]
pythonpath = .
testpaths = tests
addopts = -p no:cacheprovider
markers =
    gpu: needs an OpenGL 3.3 GPU (skipped automatically when none is available)
    gui: opens real Qt windows on the desktop
    slow: takes more than a few seconds
    astra: needs an Orbbec Astra plugged in (skipped when none is found)
